<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Hay Day Daku Cello – Daftar Harga</title>
    <meta
      name="description"
      content="Daftar harga item Hay Day Daku Cello. Pesan alat, bahan, dan kebutuhan pertanian Hay Day dengan mudah dan cepat via WhatsApp."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg1: #bfe8ff;
        --bg2: #e8f7c8;
        --card: #fffaf0;
        --ink: #4a2c12;
        --muted: #8a6a45;
        --line: #e7cf9f;
        --wood: #b8742f;
        --wood2: #8a531c;
        --green: #46b23c;
        --red: #e0442f;
        --shadow: rgba(90, 50, 10, 0.25);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg1: #14304a;
          --bg2: #1d3a1f;
          --card: #2b2216;
          --ink: #fbeccd;
          --muted: #cfae7c;
          --line: #5b4524;
          --shadow: rgba(0, 0, 0, 0.5);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg1: #14304a;
        --bg2: #1d3a1f;
        --card: #2b2216;
        --ink: #fbeccd;
        --muted: #cfae7c;
        --line: #5b4524;
        --shadow: rgba(0, 0, 0, 0.5);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Nunito", system-ui, sans-serif;
        font-weight: 600;
        color: var(--ink);
        background: linear-gradient(var(--bg1), var(--bg2) 60%, #7ccf4a 100%);
        background-attachment: fixed;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .cloud {
        position: fixed;
        top: 60px;
        font-size: 54px;
        opacity: 0.85;
        animation: drift 38s linear infinite;
        pointer-events: none;
      }
      .cloud.b {
        top: 140px;
        font-size: 38px;
        animation-duration: 55s;
        animation-delay: -20s;
      }
      @keyframes drift {
        from {
          left: -80px;
        }
        to {
          left: 105%;
        }
      }
      .wrap {
        position: relative;
        max-width: 980px;
        margin: 0 auto;
        padding: 18px 14px 150px;
      }
      header {
        text-align: center;
        position: relative;
      }
      .sign {
        display: inline-block;
        background: linear-gradient(var(--wood), var(--wood2));
        border: 5px solid #6b3c12;
        border-radius: 22px;
        padding: 10px 28px 12px;
        box-shadow:
          0 8px 0 #5a3010,
          0 14px 24px var(--shadow);
        transform: rotate(-1.5deg);
      }
      .sign h1 {
        margin: 0;
        font-family: "Lilita One", Impact, sans-serif;
        font-weight: 400;
        font-size: clamp(38px, 9vw, 64px);
        line-height: 1;
        color: #7dde3b;
        -webkit-text-stroke: 2px #1f5a10;
        text-shadow: 0 4px 0 #1f5a10;
        letter-spacing: 1px;
      }
      .sign h2 {
        margin: 2px 0 0;
        font-family: "Lilita One", Impact, sans-serif;
        font-weight: 400;
        font-size: clamp(26px, 6.5vw, 42px);
        color: #ffe14a;
        -webkit-text-stroke: 1.5px #8a4a00;
        text-shadow: 0 3px 0 #8a4a00;
      }
      .pets {
        font-size: 34px;
        margin-top: 12px;
        letter-spacing: 8px;
      }
      .pets span {
        display: inline-block;
        animation: hop 1.8s ease-in-out infinite;
      }
      .pets span:nth-child(2) {
        animation-delay: 0.25s;
      }
      .pets span:nth-child(3) {
        animation-delay: 0.5s;
      }
      .pets span:nth-child(4) {
        animation-delay: 0.75s;
      }
      .pets span:nth-child(5) {
        animation-delay: 1s;
      }
      @keyframes hop {
        0%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-12px) rotate(-8deg);
        }
      }
      .rule {
        margin: 14px auto 0;
        max-width: 560px;
        background: #fff3b0;
        color: #7a3b00;
        border: 3px dashed #e58a00;
        border-radius: 16px;
        padding: 10px 14px;
        font-weight: 800;
        text-align: center;
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.025);
        }
      }
      .stats {
        display: flex;
        gap: 10px;
        margin: 16px 0 6px;
        flex-wrap: wrap;
      }
      .stat {
        flex: 1;
        min-width: 140px;
        background: var(--card);
        border: 3px solid var(--line);
        border-radius: 16px;
        padding: 8px 12px;
        text-align: center;
        box-shadow: 0 4px 0 var(--line);
      }
      .stat small {
        display: block;
        color: var(--muted);
        font-weight: 800;
      }
      .stat b {
        font-family: "Lilita One", sans-serif;
        font-weight: 400;
        font-size: 24px;
      }
      .sec {
        margin: 26px 0 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sec span {
        font-family: "Lilita One", Impact, sans-serif;
        font-size: 22px;
        color: #fff;
        background: linear-gradient(var(--wood), var(--wood2));
        border: 3px solid #6b3c12;
        border-radius: 14px;
        padding: 4px 16px;
        box-shadow: 0 4px 0 #5a3010;
      }
      .sec i {
        flex: 1;
        height: 6px;
        border-radius: 6px;
        background: repeating-linear-gradient(
          90deg,
          #fff8 0 12px,
          transparent 12px 20px
        );
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 14px;
      }
      .card {
        position: relative;
        background: var(--card);
        border: 3px solid var(--line);
        border-radius: 20px;
        padding: 14px 12px 12px;
        text-align: center;
        box-shadow:
          0 5px 0 var(--line),
          0 10px 18px var(--shadow);
        transition: 0.2s;
      }
      .card:hover {
        transform: translateY(-4px) rotate(-0.6deg);
      }
      .card.on {
        border-color: var(--green);
        box-shadow:
          0 5px 0 #2f8a28,
          0 10px 18px var(--shadow);
      }
      .card.on::after {
        content: "✔";
        position: absolute;
        top: -10px;
        right: -8px;
        background: var(--green);
        color: #fff;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        line-height: 30px;
        font-size: 16px;
        box-shadow: 0 3px 0 #2f8a28;
      }
      .ico {
        font-size: 50px;
        line-height: 1.1;
        filter: drop-shadow(0 4px 3px #0003);
        transition: 0.2s;
      }
      .card:hover .ico {
        transform: scale(1.18) rotate(8deg);
      }
      .nm {
        font-family: "Lilita One", sans-serif;
        font-size: 19px;
        margin: 4px 0 6px;
        letter-spacing: 0.3px;
      }
      .pr {
        display: inline-block;
        color: #fff;
        font-family: "Lilita One", sans-serif;
        font-size: 19px;
        padding: 3px 18px;
        border-radius: 30px;
        box-shadow:
          inset 0 -4px 0 #0003,
          0 3px 0 #0002;
      }
      .ctl {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 10px;
      }
      .ctl button {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 12px;
        font-size: 20px;
        font-weight: 800;
        color: #fff;
        background: var(--wood);
        box-shadow: 0 4px 0 var(--wood2);
        cursor: pointer;
      }
      .ctl button:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--wood2);
      }
      .ctl input {
        width: 64px;
        height: 36px;
        text-align: center;
        border: 3px solid var(--line);
        border-radius: 12px;
        font:
          800 16px "Nunito",
          sans-serif;
        background: #fff;
        color: #4a2c12;
      }
      .add {
        margin-top: 10px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 9px;
        font:
          400 18px "Lilita One",
          sans-serif;
        color: #fff;
        background: var(--green);
        box-shadow: 0 4px 0 #2f8a28;
        cursor: pointer;
      }
      .add:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #2f8a28;
      }
      .sub {
        font-size: 13px;
        color: var(--muted);
        margin-top: 6px;
        min-height: 18px;
        font-weight: 800;
      }
      .min {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(var(--wood), var(--wood2));
        border-top: 4px solid #6b3c12;
        box-shadow: 0 -8px 20px var(--shadow);
        z-index: 5;
      }
      .bar .in {
        max-width: 980px;
        margin: auto;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tot {
        color: #fff;
        font-family: "Lilita One", sans-serif;
        font-size: 22px;
        flex: 1;
        min-width: 150px;
        line-height: 1.1;
      }
      .tot small {
        display: block;
        font:
          800 12px "Nunito",
          sans-serif;
        opacity: 0.85;
      }
      .b {
        border: 0;
        border-radius: 14px;
        padding: 10px 14px;
        font:
          400 17px "Lilita One",
          sans-serif;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 4px 0 #0004;
      }
      .b:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #0004;
      }
      .b.wa {
        background: #25b24f;
      }
      .b.cp {
        background: #2f7fe0;
      }
      .b.rs {
        background: var(--red);
      }
      .pay {
        margin-top: 30px;
        background: var(--card);
        border: 3px solid var(--line);
        border-radius: 20px;
        padding: 16px;
        text-align: center;
      }
      .pay h3 {
        margin: 0 0 10px;
        font-family: "Lilita One", sans-serif;
        font-weight: 400;
        font-size: 22px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .chips span {
        padding: 6px 14px;
        border-radius: 30px;
        color: #fff;
        font-weight: 800;
      }
      .thx {
        margin-top: 12px;
        color: var(--muted);
        font-weight: 800;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 110px;
        transform: translate(-50%, 30px);
        background: #222;
        color: #fff;
        padding: 10px 18px;
        border-radius: 30px;
        opacity: 0;
        transition: 0.3s;
        z-index: 9;
        pointer-events: none;
      }
      .toast.s {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .leaf {
        position: fixed;
        font-size: 22px;
        pointer-events: none;
        animation: fall linear infinite;
        opacity: 0.8;
      }
      @keyframes fall {
        from {
          transform: translateY(-40px) rotate(0);
        }
        to {
          transform: translateY(110vh) rotate(360deg);
        }
      }
      @media (max-width: 420px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .nm {
          font-size: 16px;
        }
        .pr {
          font-size: 16px;
          padding: 3px 12px;
        }
        .ico {
          font-size: 42px;
        }
        .ctl input {
          width: 48px;
        }
        .ctl button {
          width: 32px;
        }
      }
    </style>
  </head>
  <body>
    <div class="cloud">☁️</div>
    <div class="cloud b">☁️</div>
    <div class="wrap">
      <header>
        <div class="sign">
          <h1>HAY DAY</h1>
          <h2>Daku Cello</h2>
        </div>
        <div class="pets">
          <span>🐄</span><span>🐔</span><span>🌾</span><span>🐖</span
          ><span>🚜</span>
        </div>
        <div class="rule">⚠️ Pembelian minimal 10 per item ⚠️</div>
      </header>
      <div class="stats">
        <div class="stat"><small>📦 Total Item</small><b id="sAll">0</b></div>
        <div class="stat"><small>🛒 Dipilih</small><b id="sSel">0</b></div>
        <div class="stat">
          <small>💵 Perkiraan Harga</small><b id="sSum">Rp0</b>
        </div>
      </div>
      <div id="root"></div>
      <div class="pay">
        <h3>💳 Metode Pembayaran</h3>
        <div class="chips">
          <span style="background: #5b2ec9">OVO</span
          ><span style="background: #118ee9">DANA</span
          ><span style="background: #ee4d2d">Shopee</span
          ><span style="background: #0a5db3">BRI</span
          ><span style="background: #f08a00">SeaBank</span
          ><span style="background: #00a5cf">GoPay</span>
        </div>
        <div class="thx" id="thxText">
          🌻 Terima kasih sudah percaya! WA: 087719747833 🌻
        </div>
        <div style="text-align: center; margin-top: 10px;">
          <a href="admin.html" style="color: var(--muted); font-size: 13px; text-decoration: none; opacity: 0.7;">⚙️ Pengaturan Admin</a>
        </div>
      </div>
    </div>
    <div class="bar">
      <div class="in">
        <div class="tot">
          <small id="bCnt">Belum ada item dipilih</small
          ><span id="bSum">Rp0</span>
        </div>
        <button class="b cp" id="cp">📋 Salin</button>
        <button class="b rs" id="rs">🔄 Reset</button>
        <button class="b wa" id="wa">💬 Pesan via WA</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
      var WA = "6287719747833";
      var DEFAULT_SECTIONS = [
        {
          t: "🧰 Alat & Bahan",
          items: [
            { id: "sekop", e: "⛏️", n: "Sekop", p: 1000, c: "#7a2fe0" },
            { id: "kapak", e: "🪓", n: "Kapak", p: 1000, c: "#e8359b" },
            { id: "gergaji", e: "🪚", n: "Gergaji", p: 1500, c: "#e0232f" },
          ],
        },
        {
          t: "🥛 Dapur & Peternakan",
          items: [
            { id: "krim", e: "🥣", n: "Krim", p: 1000, c: "#f57c1f" },
            {
              id: "gulaputih",
              e: "🧂",
              n: "Gula Putih",
              p: 1500,
              c: "#e9b200",
            },
            {
              id: "gulamerah",
              e: "🍫",
              n: "Gula Merah",
              p: 1000,
              c: "#27b83a",
            },
            { id: "babi", e: "🥩", n: "Daging Babi", p: 1200, c: "#13a9a0" },
            { id: "telor", e: "🥚", n: "Telor", p: 1000, c: "#2d73e6" },
            { id: "mentega", e: "🧈", n: "Mentega", p: 1000, c: "#7a2fe0" },
            { id: "keju", e: "🧀", n: "Keju", p: 1500, c: "#e8359b" },
            { id: "madu", e: "🍯", n: "Madu", p: 2000, c: "#e0232f" },
          ],
        },
        {
          t: "🌊 Laut",
          items: [
            { id: "ikan", e: "🐟", n: "Ikan", p: 1500, c: "#7a2fe0" },
            { id: "lopster", e: "🦞", n: "Lopster", p: 2500, c: "#13a9a0" },
          ],
        },
        {
          t: "🏡 Tagar BEM (per paket)",
          pk: 1,
          items: [
            { id: "bem1", e: "🏡", n: "1 Tagar BEM", p: 1500, c: "#2e9a3a" },
            { id: "bem30", e: "🏘️", n: "30 Tagar BEM", p: 28500, c: "#2d73e6" },
          ],
        },
        {
          t: "🪙 Koin LV 40++ (Lumbung kosong 250)",
          pk: 1,
          items: [
            { id: "k1", e: "🪙", n: "1 Juta Koin", p: 8000, c: "#7a2fe0" },
            { id: "k10", e: "💰", n: "10 Juta Koin", p: 70000, c: "#e8359b" },
          ],
        },
      ];
      var SECTIONS = DEFAULT_SECTIONS;
      try {
        var savedStore = localStorage.getItem("hayday_daku_cello_data");
        if (savedStore) {
          var parsed = JSON.parse(savedStore);
          if (parsed.wa) WA = parsed.wa;
          if (parsed.thx) {
            var thxEl = document.getElementById("thxText");
            if (thxEl) thxEl.textContent = parsed.thx;
          }
          if (parsed.sections && Array.isArray(parsed.sections) && parsed.sections.length > 0) {
            SECTIONS = parsed.sections;
          }
        }
      } catch (err) {
        console.warn("Memakai data default:", err);
      }
      var ALL = [],
        q = {};
      function rp(n) {
        return (
          "Rp" +
          Math.round(n)
            .toString()
            .replace(/\B(?=(\d{3})+(?!\d))/g, ".")
        );
      }
      function unit(it) {
        return it.pk ? 1 : 100;
      }
      function minq(it) {
        return it.pk ? 1 : 10;
      }
      function stepq(it) {
        return it.pk ? 1 : 10;
      }
      function price(it) {
        return (it.p / unit(it)) * (q[it.id] || 0);
      }
      function label(it) {
        return it.pk ? it.n : "100 " + it.n;
      }
      var root = document.getElementById("root");
      SECTIONS.forEach(function (s) {
        var h =
          '<div class="sec"><span>' +
          s.t +
          '</span><i></i></div><div class="grid">';
        s.items.forEach(function (it) {
          it.pk = s.pk || 0;
          ALL.push(it);
          h +=
            '<div class="card" id="c-' +
            it.id +
            '"><div class="ico">' +
            it.e +
            '</div><div class="nm">' +
            label(it) +
            "</div>" +
            '<span class="pr" style="background:' +
            it.c +
            '">' +
            rp(it.p) +
            "</span>" +
            '<div class="min">' +
            (it.pk ? "Per paket" : "Min. beli 10 • harga per 100") +
            "</div>" +
            '<div id="x-' +
            it.id +
            '"></div></div>';
        });
        root.insertAdjacentHTML("beforeend", h + "</div>");
      });
      function ctrl(it) {
        var v = q[it.id] || 0,
          el = document.getElementById("x-" + it.id);
        if (!v) {
          el.innerHTML =
            '<button class="add" data-a="add" data-i="' +
            it.id +
            '">＋ Pilih</button><div class="sub"></div>';
          return;
        }
        el.innerHTML =
          '<div class="ctl"><button data-a="dec" data-i="' +
          it.id +
          '">−</button><input type="number" inputmode="numeric" value="' +
          v +
          '" data-a="inp" data-i="' +
          it.id +
          '"><button data-a="inc" data-i="' +
          it.id +
          '">+</button></div><div class="sub">' +
          (it.pk ? "" : v + " pcs = ") +
          rp(price(it)) +
          "</div>";
      }
      function get(id) {
        return ALL.filter(function (x) {
          return x.id === id;
        })[0];
      }
      function set(it, v) {
        v = Math.floor(Number(v)) || 0;
        if (v <= 0) v = 0;
        else if (v < minq(it)) {
          v = minq(it);
          toast("Minimal pembelian " + minq(it) + " per item ya! 🌾");
        }
        q[it.id] = v;
        ctrl(it);
        upd();
      }
      function upd() {
        var n = 0,
          sum = 0;
        ALL.forEach(function (it) {
          var on = (q[it.id] || 0) > 0;
          document.getElementById("c-" + it.id).classList.toggle("on", on);
          if (on) {
            n++;
            sum += price(it);
          }
        });
        document.getElementById("sAll").textContent = ALL.length;
        document.getElementById("sSel").textContent = n;
        document.getElementById("sSum").textContent = rp(sum);
        document.getElementById("bSum").textContent = rp(sum);
        document.getElementById("bCnt").textContent = n
          ? n + " item dipilih"
          : "Belum ada item dipilih";
      }
      root.addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        var it = get(b.dataset.i),
          v = q[it.id] || 0;
        if (b.dataset.a === "add") set(it, minq(it));
        if (b.dataset.a === "inc") set(it, v + stepq(it));
        if (b.dataset.a === "dec")
          set(it, v - stepq(it) < minq(it) ? 0 : v - stepq(it));
      });
      root.addEventListener("change", function (e) {
        var t = e.target;
        if (t.dataset.a === "inp") set(get(t.dataset.i), t.value);
      });
      function text() {
        var l = [],
          sum = 0;
        ALL.forEach(function (it) {
          if (q[it.id]) {
            sum += price(it);
            l.push(
              "• " +
                label(it) +
                (it.pk ? "" : " → " + q[it.id] + " pcs") +
                " = " +
                rp(price(it)),
            );
          }
        });
        if (!l.length) return "";
        return (
          "Halo Daku Cello, saya mau pesan:\n" +
          l.join("\n") +
          "\n\nTotal: " +
          rp(sum) +
          "\n(Min. beli 10 per item)"
        );
      }
      var tt;
      function toast(m) {
        var t = document.getElementById("toast");
        t.textContent = m;
        t.classList.add("s");
        clearTimeout(tt);
        tt = setTimeout(function () {
          t.classList.remove("s");
        }, 2200);
      }
      document.getElementById("cp").onclick = function () {
        var s = text();
        if (!s) return toast("Belum ada item dipilih 🌱");
        try {
          navigator.clipboard.writeText(s).then(function () {
            toast("List berhasil disalin ✅");
          }, fb);
        } catch (x) {
          fb();
        }
        function fb() {
          var a = document.createElement("textarea");
          a.value = s;
          document.body.appendChild(a);
          a.select();
          try {
            document.execCommand("copy");
            toast("List berhasil disalin ✅");
          } catch (x) {
            toast("Gagal menyalin");
          }
          a.remove();
        }
      };
      document.getElementById("rs").onclick = function () {
        q = {};
        ALL.forEach(ctrl);
        upd();
        toast("Pesanan direset 🔄");
      };
      document.getElementById("wa").onclick = function () {
        var s = text();
        if (!s) return toast("Pilih item dulu ya 🌱");
        var a = document.createElement("a");
        a.href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(s);
        a.target = "_blank";
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
      };
      ALL.forEach(ctrl);
      upd();
      ["🍃", "🌾", "🌻", "🍂"].forEach(function (c, i) {
        for (var k = 0; k < 3; k++) {
          var d = document.createElement("div");
          d.className = "leaf";
          d.textContent = c;
          d.style.left = Math.random() * 100 + "vw";
          d.style.animationDuration = 12 + Math.random() * 12 + "s";
          d.style.animationDelay = -Math.random() * 20 + "s";
          document.body.appendChild(d);
        }
      });
    </script>
  </body>
</html>
